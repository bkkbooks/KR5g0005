body:
  text: 稽首七元天星君速來救劫護天民稽首破軍天星君速來救劫護天民稽首天罡大星君速來救劫護天民稽首霹靂大仙君速來救劫護天民稽首庚辛白帝君速來救劫護天民稽首壬癸黑帝君速來救劫䕶天民稽首甲乙青帝君速來救劫護天民稽首丙丁赤帝君速來救劫護天民稽首中央黄帝君速來救劫護天民稽首救劫衆將軍速來救劫䕶天民稽首太歲保生兵速來救劫䕶天民稽首五方雷賫將速來救劫護天民吾乃青蓮子元皇道祖孫天罡來扶我七帝䕶吾身八卦爲神力萬禍化爲塵登山通猛宇渡水引隂從出行天命護入陣九光軍順我成眞道違我滅逆形急急金華勅昊天玉皇文太上金華天尊救劫䕶命妙經
  hash: sha256:59f95d1a7bf0d3d65ebc272a30329270ca286ca10fe177d8053b0ba8c943b780
