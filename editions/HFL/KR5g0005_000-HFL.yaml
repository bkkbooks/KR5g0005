front:
  text: 太上金華天尊救劫護命妙經金華天尊敕延眞救劫經至眞無極道虚皇最上尊避隱恒救劫時因壬運興三昩九眞相大洞起超明驅除凶悖氣眞道救群生劫期生死㑹善惡運當分元皇玉帝勑較録普天民善則超三界魔王來敬迎有過沉九地萬劫歷幽㝠諸天同考較分毫無隱容時遇清虚降捜究萬仙眞元華眞大道末劫小人輕聰明頤者廢敬信遇之成青蓮栽滿地攀採污泥中聖凡皆有分焉論貴何貧有縁須敬授遇必證金身普天聞正道俱下寄凡塵爭取金天號皆尋不壤因所以隂陽否天昏地翳騰六洞精魔出九天祅怪生六合成既濟水火自交并混混渾一體各各内尋眞火煆眞精灼凶邪悖逆傾隂陽純粹子精燦結眞人元一成舍利雜穢化爲塵其中靈應實誅斬萬魔群七帝承元命軸關下紫庭破武廉文禄巨貪爲帝眞五德眞光射妖魔自不神霹靂南丹勝破軍北極眞西方白帝子東界護生君中央天元號擊電滅祅氛天威同太歲雷賁萬億神飛羽金身現躬鞭護吉人天罡驅穢惡萬萬斬邪形武祖金華勑八卦助神兵乾元坤應德震巽霹靂風艮壓祅魔碎离燒百怪凶兊澤通萬里坎吉護天民天罡并昊勑誦佩禍無因有縁人得遇急急速勤行無縁必見毁准備化黄塵神應急如電授者愼莫輕誦持心不退闔户見清平目前壬辰道陸地得登雲愚迷全不悟毁謗妄招凶執閉癡心客猶罪殢華文此是天元法萬劫再難逢遇者超三界永不降凡塵生滅俱無異方崇救劫經聞命無上語稽首禮慈尊無礙無爲體坦蕩度刀兵
