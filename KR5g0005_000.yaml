body:
  text: 稽首七元天星君速來救劫護天民稽首破軍天星君速來救劫護天民稽首天罡大星君速來救劫護天民稽首霹靂大仙君速來救劫護天民稽首庚辛白帝君速來救劫護天民稽首壬癸黑帝君速來救劫護天民稽首甲乙青帝君速來救劫護天民稽首丙丁赤帝君速來救劫護天民稽首中央黃帝君速來救劫護天民稽首救劫衆將軍速來救劫護天民稽首太歲保生兵速來救劫護天民稽首五方雷賫將速來救劫護天民吾乃青蓮子元皇道祖孫天罡來扶我七帝護吾身八卦為神力萬禍化為塵登山通猛宇渡水引隂從出行天命護入陳九光軍順我成真道違我滅逆形急急金華敕昊天玉皇文太上金華天尊救劫護命妙經
  hash: sha256:66b0d50bb5a7657a19fb43b45bab32d4329e89fb5acfbf4775a170fe04d6b412
